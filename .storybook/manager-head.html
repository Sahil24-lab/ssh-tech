<!-- impeccable-disable overused-font -- Montserrat is the canonical SSH design-system face. -->
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --font-montserrat: "Montserrat";
    --font-jetbrains-mono: "JetBrains Mono";
    --ssh-primary: #07dfc1;
    --ssh-primary-dark: #029f8c;
    --ssh-primary-contrast: #003330;
    --ssh-paper: #091f2c;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  :focus-visible {
    outline: 3px solid var(--ssh-primary) !important;
    outline-offset: 3px !important;
  }

  .sidebar-item[data-selected="true"] {
    background: var(--ssh-primary) !important;
    color: var(--ssh-primary-contrast) !important;
  }

  .sidebar-item[data-selected="true"] * {
    color: inherit !important;
    fill: currentColor !important;
  }

  * {
    scrollbar-color: var(--ssh-primary) var(--ssh-paper);
    scrollbar-width: thin;
  }

  *::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }

  *::-webkit-scrollbar-track {
    background: var(--ssh-paper);
  }

  *::-webkit-scrollbar-thumb {
    background: var(--ssh-primary);
    border: 2px solid var(--ssh-paper);
    border-radius: 8px;
  }

  *::-webkit-scrollbar-thumb:hover {
    background: var(--ssh-primary-dark);
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
